<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ความชุกรายอำเภอ | ทีมงานภายใน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard ผู้รับบริการจิตเวช รพ.จิตเวชเลยราชนครินทร์</h1>
        <p>รายงานความชุกและสถิติรายอำเภอ (มุมมองทีมปฏิบัติการ)</p>
    </div>

    <div id="navbar-container"></div>

    <div class="global-controls" style="display: flex;">
        <div class="tabs" id="provinceTabs"></div>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btnOPD" onclick="setType('OPD')">OPD (ผู้ป่วยนอก)</button>
            <button class="toggle-btn" id="btnIPD" onclick="setType('IPD')">IPD (ผู้ป่วยใน)</button>
        </div>
    </div>

    <div class="content-section">
        <div class="main-chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        
        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th class="sortable" id="header-district" onclick="handleSort('district')">อำเภอ <span class="sort-icon" id="icon-district"></span></th>
                        <th class="sortable" onclick="handleSort('year0')">ปี 2564 <span class="sort-icon" id="icon-year0"></span></th>
                        <th class="sortable" onclick="handleSort('year1')">ปี 2565 <span class="sort-icon" id="icon-year1"></span></th>
                        <th class="sortable" onclick="handleSort('year2')">ปี 2566 <span class="sort-icon" id="icon-year2"></span></th>
                        <th class="sortable" onclick="handleSort('year3')">ปี 2567 <span class="sort-icon" id="icon-year3"></span></th>
                        <th class="sortable" onclick="handleSort('year4')">ปี 2568 <span class="sort-icon" id="icon-year4"></span></th>
                        <th class="sortable total-col" onclick="handleSort('total')">รวม 5 ปี <span class="sort-icon" id="icon-total"></span></th>
                        <th class="sortable pop-col" onclick="handleSort('pop')">ประชากร (คน) <span class="sort-icon" id="icon-pop"></span></th>
                        <th class="sortable prev-col" onclick="handleSort('prev')">ความชุกปี 68 <br>(ต่อแสนฯ) <span class="sort-icon" id="icon-prev">🔽</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="credit-footer">
        📝 สรุปข้อมูลโดยกลุ่มงานพัฒนาคุณภาพบริการและมาตรฐาน รพ.จิตเวชเลยราชนครินทร์
    </div>
</div>

<script src="../data/db_population.js"></script>
<script src="../data/db_substance.js"></script>
<script src="../assets/navbar.js"></script>

<script>
    Chart.defaults.font.family = "'Sarabun', sans-serif";
    loadNavbar('internal', 'prevalence');

    // 🌟 อัปเดต: เพิ่มแท็บรวม
    const provinces = ["รวม 4 จังหวัด", "เลย", "หนองบัวลำภู", "อุดรธานี", "หนองคาย"];
    let currentProvince = provinces[0];
    let currentType = 'OPD'; 
    let currentSortCol = 'prev';
    let sortAsc = false;

    const f1xDataDict = typeof getParsedF1xData === 'function' ? getParsedF1xData() : {};

    const tabContainer = document.getElementById('provinceTabs');
    provinces.forEach(prov => {
        const btn = document.createElement('button');
        if(prov === "รวม 4 จังหวัด") btn.style.fontWeight = 'bold';
        btn.className = `tab-btn ${prov === currentProvince ? 'active' : ''}`;
        btn.innerText = prov;
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentProvince = prov;
            updateDistrictView();
        };
        tabContainer.appendChild(btn);
    });

    function setType(type) {
        currentType = type;
        document.getElementById('btnOPD').classList.toggle('active', type === 'OPD');
        document.getElementById('btnIPD').classList.toggle('active', type === 'IPD');
        updateDistrictView();
    }

    let viewChartInstance = null;

    function updateDistrictView() {
        let renderData = [];

        // 🌟 Logic ดึงข้อมูลภาพรวม
        if (currentProvince === "รวม 4 จังหวัด") {
            document.getElementById('header-district').innerHTML = `จังหวัด <span class="sort-icon" id="icon-district"></span>`;
            
            ["เลย", "หนองบัวลำภู", "อุดรธานี", "หนองคาย"].forEach(prov => {
                const dists = f1xDataDict[prov];
                if (!dists) return;

                let pDataArr = [0,0,0,0,0];
                let pTotal = 0;
                let pPop = 0;

                Object.keys(dists).forEach(d => {
                    const grp = dists[d].allCases || { opd: [0,0,0,0,0], ipd: [0,0,0,0,0], opdTot: 0, ipdTot: 0 };
                    const arr = currentType === 'OPD' ? grp.opd : grp.ipd;
                    for(let i=0; i<5; i++) pDataArr[i] += arr[i];
                    pTotal += (currentType === 'OPD' ? grp.opdTot : grp.ipdTot);
                    pPop += districtPopulation[d] || 0;
                });

                const prev = pPop > 0 ? (pDataArr[4] / pPop) * 100000 : 0;
                renderData.push({ district: prov, dataArr: pDataArr, total: pTotal, pop: pPop, prev: prev });
            });
        } else {
            document.getElementById('header-district').innerHTML = `อำเภอ <span class="sort-icon" id="icon-district"></span>`;
            const dists = f1xDataDict[currentProvince];
            if(dists) {
                renderData = Object.keys(dists).map(d => {
                    const grp = dists[d].allCases || { opd: [0,0,0,0,0], ipd: [0,0,0,0,0], opdTot: 0, ipdTot: 0 };
                    const dataArr = currentType === 'OPD' ? grp.opd : grp.ipd;
                    const total = currentType === 'OPD' ? grp.opdTot : grp.ipdTot;
                    const pop = districtPopulation[d] || 0;
                    const prev = pop > 0 ? (dataArr[4] / pop) * 100000 : 0;
                    return { district: d, dataArr, total, pop, prev };
                });
            }
        }

        if (currentSortCol) {
            renderData.sort((a, b) => {
                let valA, valB;
                if (currentSortCol === 'district') { valA = a.district; valB = b.district; }
                else if (currentSortCol.startsWith('year')) { const idx = parseInt(currentSortCol.replace('year', '')); valA = a.dataArr[idx]; valB = b.dataArr[idx]; }
                else { valA = a[currentSortCol]; valB = b[currentSortCol]; }
                if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB, 'th') : valB.localeCompare(valA, 'th');
                return sortAsc ? valA - valB : valB - valA;
            });
        }
        
        document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '');
        if (currentSortCol) {
            const iconEl = document.getElementById(`icon-${currentSortCol}`);
            if (iconEl) iconEl.innerText = sortAsc ? '🔼' : '🔽';
        }

        const ctx = document.getElementById('mainChart').getContext('2d');
        const chartColors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#34495e', '#d35400', '#c0392b'];
        const datasets = renderData.map((d, i) => ({ label: d.district, data: d.dataArr, borderColor: chartColors[i % chartColors.length], borderWidth: 2, tension: 0.3 }));

        const titleText = currentProvince === "รวม 4 จังหวัด" 
            ? `แนวโน้มความชุกผู้ป่วย ${currentType} (ทุกโรค) เปรียบเทียบ 4 จังหวัด` 
            : `แนวโน้มผู้ป่วย ${currentType} (ทุกโรค) จังหวัด${currentProvince} รายอำเภอ`;

        if (viewChartInstance) viewChartInstance.destroy();
        viewChartInstance = new Chart(ctx, {
            type: 'line', data: { labels: ['ปี 2564', 'ปี 2565', 'ปี 2566', 'ปี 2567', 'ปี 2568'], datasets: datasets },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, title: { display: true, text: titleText, font: { size: 16 } } } }
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        renderData.forEach(d => {
            const popStr = d.pop > 0 ? d.pop.toLocaleString() : 'ไม่พบข้อมูล';
            const prevStr = d.pop > 0 ? d.prev.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1}) : 'N/A';
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${d.district}</td><td>${d.dataArr[0].toLocaleString()}</td><td>${d.dataArr[1].toLocaleString()}</td><td>${d.dataArr[2].toLocaleString()}</td><td>${d.dataArr[3].toLocaleString()}</td><td>${d.dataArr[4].toLocaleString()}</td><td class="total-col">${d.total.toLocaleString()}</td><td class="pop-col">${popStr}</td><td class="prev-col">${prevStr}</td>`;
            tbody.appendChild(tr);
        });
    }

    function handleSort(col) {
        if (currentSortCol === col) sortAsc = !sortAsc; 
        else { currentSortCol = col; sortAsc = col === 'district' ? true : false; }
        updateDistrictView();
    }

    updateDistrictView();
</script>

</body>
</html>
