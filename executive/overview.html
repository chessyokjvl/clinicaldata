<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพรวม 5 อันดับกลุ่มโรค | ผู้บริหาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dashboard ผู้รับบริการจิตเวช เขตสุขภาพที่ 8</h1>
        <p>รายงานภาพรวม 5 อันดับกลุ่มโรค (มุมมองผู้บริหาร)</p>
    </div>

    <div id="navbar-container"></div>

    <div class="content-section">
        <div class="chart-grid" id="chartGrid">
            </div>
    </div>

    <div class="credit-footer">
        📝 สรุปข้อมูลโดยกลุ่มงานพัฒนาคุณภาพบริการและมาตรฐาน รพ.จิตเวชเลยราชนครินทร์
    </div>
</div>

<script src="../data/db_disease_trend.js"></script>
<script src="../assets/navbar.js"></script>

<script>
    // ตั้งค่าฟอนต์เริ่มต้นให้กราฟ
    Chart.defaults.font.family = "'Sarabun', sans-serif";

    // 1. โหลดเมนู Navbar (ระบุว่าอยู่ level 'executive' และหน้าปัจจุบันคือ 'overview')
    loadNavbar('executive', 'overview');

    // 2. สร้างกราฟจากข้อมูลใน db_disease_trend.js
    const grid = document.getElementById('chartGrid');
    
    // วนลูปสร้างการ์ดและกราฟตามจำนวนจังหวัดที่มีในฐานข้อมูล
    Object.keys(diseaseData).forEach(province => {
        // สร้างการ์ด HTML
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `<h3>จังหวัด${province}</h3><div class="grid-chart-container"><canvas></canvas></div>`;
        grid.appendChild(card);

        // วาดกราฟ
        new Chart(card.querySelector('canvas').getContext('2d'), {
            type: 'line', 
            data: { 
                labels: ['ปี 2566', 'ปี 2567', 'ปี 2568'], 
                datasets: diseaseData[province] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { 
                    legend: { 
                        position: 'bottom', 
                        labels: { boxWidth: 10, font: { size: 11 } } 
                    } 
                }, 
                elements: { 
                    line: { tension: 0.3, borderWidth: 2.5 }, 
                    point: { radius: 3 } 
                } 
            }
        });
    });
</script>

</body>
</html>
